name: pachinko-collect-4yen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pachinko-collect.yml'
      - 'pachinko-ai/src/importers/**'
  schedule:
    - cron: '30 1 * * *'
    - cron: '31 3 * * *'
    - cron: '32 5 * * *'
    - cron: '33 7 * * *'
    - cron: '34 9 * * *'
    - cron: '35 11 * * *'
    - cron: '36 13 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pachinko-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect all discovered 4-yen non-sea models
        env:
          SITE777_INDEX_URL: ${{ secrets.SITE777_INDEX_URL }}
        run: node src/importers/collect-site777-models.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pachinko-snapshot-${{ github.run_id }}
          path: pachinko-ai/data/snapshots/
