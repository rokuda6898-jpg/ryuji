name: pachinko-collect-4yen
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pachinko-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Site777 page
        run: node src/importers/site777.js
      - name: Validate 4-yen graph HTML
        run: node src/importers/validate-latest.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site777-raw
          path: pachinko-ai/data/raw/
