name: pachinko-collect-4yen
on:
  workflow_dispatch:
  schedule:
    # JST: 10:30, 12:31, 14:32, 16:33, 18:34, 20:35, 22:36
    - cron: '30 1 * * *'
    - cron: '31 3 * * *'
    - cron: '32 5 * * *'
    - cron: '33 7 * * *'
    - cron: '34 9 * * *'
    - cron: '35 11 * * *'
    - cron: '36 13 * * *'
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pachinko-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch Site777 page
        run: node src/importers/site777.js
      - name: Validate 4-yen graph HTML
        run: node src/importers/validate-latest.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site777-raw-${{ github.run_id }}
          path: pachinko-ai/data/raw/
