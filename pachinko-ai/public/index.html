<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pachinko AI Mobile</title><style>body{font-family:-apple-system,sans-serif;background:#111;color:#fff;margin:0;padding:24px}main{max-width:680px;margin:auto}h1{font-size:28px}textarea{width:100%;height:45vh;box-sizing:border-box;border-radius:12px;padding:12px;font-size:14px}button{width:100%;padding:16px;margin-top:12px;border:0;border-radius:12px;font-size:18px;font-weight:700}pre{white-space:pre-wrap;background:#222;padding:12px;border-radius:12px}</style></head><body><main><h1>Pachinko AI</h1><p>Site777のページHTMLを貼り付けて送信します。4円・海物語以外のみ受け付けます。</p><textarea id="h" placeholder="Site777 HTML"></textarea><button id="b">AIへ送信</button><pre id="r"></pre><script>b.onclick=async()=>{r.textContent='送信中…';try{const x=await fetch('/api/import',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({html:h.value})});const j=await x.json();r.textContent=j.ok?'取得成功: '+j.model+' / '+j.machines.length+'台':('エラー: '+j.error)}catch(e){r.textContent='エラー: '+e.message}}</script></main></body></html>
