name: collect-4yen
on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'
jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pachinko-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node src/importers/site777.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site777-raw
          path: pachinko-ai/data/raw/
